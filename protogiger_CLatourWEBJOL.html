<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocole de Test Allemand - V2024</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #0f172a; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 30px; font-weight: 800; font-size: 28px; }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 18px; margin-bottom: 20px; outline: none; }
        .input-field:focus { border-color: #2563eb; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 15px; display: inline-block; text-align: center; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-primary { background: #1e293b; color: white; }
        .btn-accent { background: #2563eb; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-ghost { background: transparent; border: 1px solid #cbd5e1; color: #64748b; }
        .progress-bar { height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #2563eb; transition: width 0.3s; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        label { font-weight: 700; font-size: 14px; margin-bottom: 5px; display: block; color: #475569; }
        
        .jol-container { margin: 30px 0; }
        .jol-question { font-size: 19px; font-weight: 600; margin-bottom: 25px; color: #1e293b; line-height: 1.4; }
        .jol-scale { display: flex; justify-content: space-between; align-items: flex-end; max-width: 550px; margin: 0 auto; }
        .jol-item { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; }
        .jol-smiley { font-size: 45px; cursor: pointer; }
        .jol-label { font-size: 12px; font-weight: 800; color: #64748b; width: 90px; }
        .jol-radio { width: 22px; height: 22px; cursor: pointer; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        .badge-test { background: #dbeafe; color: #1e40af; }
        .badge-study { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- VOTRE NOUVELLE ADRESSE GOOGLE SHEET ---
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxbZBWrOy83EUJI-wd8QT1CCWSAjapE6p7rLG2Ky4IIVI6RgdBOTxOP_VoCq9_eB7I/exec";

        const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
        const normalize = (s) => s ? s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").trim() : "";

        function App() {
            const [phase, setPhase] = useState('SETUP');
            const [words, setWords] = useState([]);
            const [student, setStudent] = useState({ 
                id: "", age: "", niveau: "", genre: "", 
                session: "1", groupe: "1",
                date: new Date().toISOString().split('T')[0] 
            });
            const [sessionData, setSd] = useState(null);
            const [blockNum, setBlockNum] = useState(1);
            const [isSending, setIsSending] = useState(false);

            const loadList = (e) => {
                const fr = new FileReader();
                fr.onload = (ev) => {
                    const imported = JSON.parse(ev.target.result);
                    setWords(imported.map(w => ({ id: parseInt(w.id), french: w.french, foreign: w.german, jol_score: null })));
                };
                fr.readAsText(e.target.files[0]);
            };

            const sendToSheet = async (finalData) => {
                setIsSending(true);
                
                const grp = finalData.student.groupe;
                const testIds = grp === "1" ? [1, 2, 3] : [4, 5, 6];
                const studyIds = grp === "1" ? [4, 5, 6] : [1, 2, 3];

                const b1 = finalData.blockStats[1]?.success || 0;
                const b2 = finalData.blockStats[2]?.success || 0;
                
                const jolTests = finalData.words.filter(w => testIds.includes(w.id)).map(w => w.jol_score || 0);
                const moyJolTest = jolTests.length ? (jolTests.reduce((a, b) => a + b, 0) / jolTests.length).toFixed(2) : 0;

                const jolStudies = finalData.words.filter(w => studyIds.includes(w.id)).map(w => w.jol_score || 0);
                const moyJolRestudy = jolStudies.length ? (jolStudies.reduce((a, b) => a + b, 0) / jolStudies.length).toFixed(2) : 0;

                const payload = {
                    id: finalData.student.id,
                    date: finalData.student.date,
                    age: finalData.student.age,
                    niveau: finalData.student.niveau,
                    genre: finalData.student.genre,
                    session: finalData.student.session,
                    groupe: finalData.student.groupe,
                    b1_s: b1,
                    b2_s: b2,
                    total_6: b1 + b2,
                    moy_jol_test: moyJolTest,
                    moy_jol_restudy: moyJolRestudy,
                    time: Math.floor((Date.now() - finalData.startTime) / 60000)
                };

                const completeData = { ...finalData, calculatedStats: payload };
                setSd(completeData);

                try {
                    await fetch(GOOGLE_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setPhase('FINISH');
                } catch (e) {
                    setPhase('END');
                }
                setIsSending(false);
            };

            if (phase === 'SETUP') return (
                <div className="container"><div className="card">
                    <h1>Configuration</h1>
                    <div style={{textAlign:'center', marginBottom:25}}>
                        <Button onClick={() => document.getElementById('il').click()} variant="ghost">📥 Charger Liste Allemand (JSON)</Button>
                        <input type="file" id="il" style={{display:'none'}} onChange={loadList} />
                    </div>
                    <div className="setup-grid">
                        <div><label>ID Sujet</label><input className="input-field" value={student.id} onChange={e => setStudent({...student, id: e.target.value})} /></div>
                        <div><label>Date</label><input className="input-field" type="date" value={student.date} onChange={e => setStudent({...student, date: e.target.value})} /></div>
                        <div>
                            <label>Groupe</label>
                            <select className="input-field" value={student.groupe} onChange={e => setStudent({...student, groupe: e.target.value})}>
                                <option value="1">Groupe 1</option>
                                <option value="2">Groupe 2</option>
                            </select>
                        </div>
                        <div>
                            <label>Session</label>
                            <select className="input-field" value={student.session} onChange={e => setStudent({...student, session: e.target.value})}>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                            </select>
                        </div>
                        <div><label>Âge</label><input className="input-field" type="number" value={student.age} onChange={e => setStudent({...student, age: e.target.value})} /></div>
                        <div><label>Niveau</label><input className="input-field" value={student.niveau} onChange={e => setStudent({...student, niveau: e.target.value})} /></div>
                        <div>
                            <label>Genre</label>
                            <select className="input-field" value={student.genre} onChange={e => setStudent({...student, genre: e.target.value})}>
                                <option value="">Choisir...</option><option value="Fille">Fille</option><option value="Garçon">Garçon</option><option value="Autre">Autre</option>
                            </select>
                        </div>
                    </div>
                    <Button onClick={() => {
                        if(!student.id || words.length === 0) return alert("Complétez l'ID et chargez le fichier JSON.");
                        setSd({ student, words, blockStats: {}, startTime: Date.now() });
                        setPhase('INSTR');
                    }} variant="accent" style={{width:'100%'}}>Démarrer l'expérience</Button>
                </div></div>
            );

            if (phase === 'INSTR') return (
                <div className="container"><div className="card" style={{textAlign:'center'}}>
                    <h2>Phase d'acquisition</h2>
                    <p style={{fontSize: 22, margin: '30px 0'}}>Mémorise ces 6 mots allemands.</p>
                    <Button onClick={() => setPhase('ACQ')} variant="accent">Commencer</Button>
                </div></div>
            );

            if (phase === 'ACQ') return <Acquisition words={sessionData.words} onDone={() => setPhase('BLOCK')} />;

            if (phase === 'BLOCK') return <BlockManager 
                key={blockNum} session={sessionData} block={blockNum} 
                onUpdateWords={nw => setSd(prev => ({...prev, words: nw}))}
                onStats={st => setSd(prev => ({...prev, blockStats: {...prev.blockStats, [blockNum]: st}}))}
                onNextBlock={n => setBlockNum(n)} 
                onDone={() => sendToSheet(sessionData)} />;

            if (isSending) return <div className="container"><div className="card" style={{textAlign:'center'}}><h1>Analyse et envoi des données...</h1></div></div>;

            if (phase === 'FINISH' || phase === 'END') return (
                <div className="container"><div className="card" style={{textAlign:'center'}}>
                    <h1>Merci !</h1>
                    <p style={{marginBottom:20}}>L'expérience est terminée.</p>
                    <Button onClick={() => {
                        const b = new Blob([JSON.stringify(sessionData)], {type:"application/json"});
                        const a = document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`data_${student.id}.json`; a.click();
                    }} variant="warning">💾 Sauvegarder le fichier JSON</Button>
                </div></div>
            );

            return null;
        }

        function Acquisition({ words, onDone }) {
            const list = useMemo(() => shuffle(words), []);
            const [idx, setIdx] = useState(0);
            return ( 
                <div className="container">
                    <ProgressBar current={idx+1} total={list.length} label="Mémorisation" />
                    <div className="card" style={{textAlign:'center'}}>
                        <div style={{fontSize:54, fontWeight:900}}>{list[idx].foreign}</div>
                        <div style={{fontSize:36, color:'#64748b', marginBottom:40}}>{list[idx].french}</div>
                        <Button onClick={() => idx < list.length - 1 ? setIdx(idx+1) : onDone()} variant="accent">Mot suivant</Button>
                    </div>
                </div> 
            );
        }

        function BlockManager({ session, block, onNextBlock, onDone, onStats, onUpdateWords }) {
            const queue = useMemo(() => {
                const items = session.words.map(w => ({
                    ...w, cond: (session.student.groupe === "1") ? (w.id <= 3 ? "TEST" : "STUDY") : (w.id <= 3 ? "STUDY" : "TEST")
                }));
                return shuffle(items);
            }, [session.words]);

            const [ptr, setPtr] = useState(0);
            const [step, setStep] = useState('TASK');
            const [typed, setTyped] = useState("");
            const [fb, setFb] = useState({ msg: "", show: false });
            const [st, setSt] = useState({ success: 0 });
            const [jolValue, setJolValue] = useState(null);

            const cur = queue[ptr];

            const validateTest = () => {
                const ok = normalize(typed) === normalize(cur.french);
                if (ok) { setSt(p => ({...p, success: p.success+1})); setFb({ msg: "Correct !", show: false }); }
                else { setFb({ msg: "Faux. La réponse était :", show: true }); }
                setStep('FB');
            };

            const goToNext = () => {
                if (ptr + 1 < queue.length) { setPtr(ptr + 1); setStep('TASK'); setTyped(""); setJolValue(null); }
                else { onStats(st); if (block < 2) onNextBlock(block + 1); else onDone(); }
            };

            const handleJolSubmit = () => {
                const updated = session.words.map(w => w.id === cur.id ? {...w, jol_score: jolValue} : w);
                onUpdateWords(updated);
                goToNext();
            };

            return (
                <div className="container">
                    <ProgressBar current={ptr+1} total={queue.length} label={`Bloc ${block} / 2`} />
                    <div className="card" style={{textAlign:'center'}}>
                        
                        {step === 'TASK' && (
                            cur.cond === 'TEST' ? (
                                <div>
                                    <span className="badge badge-test">TEST</span>
                                    <div style={{fontSize:50, fontWeight:900}}>{cur.foreign}</div>
                                    <input className="input-field" autoFocus value={typed} onChange={e => setTyped(e.target.value)} onKeyPress={e => e.key === 'Enter' && validateTest()} />
                                    <Button onClick={validateTest} variant="accent">Valider</Button>
                                </div>
                            ) : (
                                <div>
                                    <span className="badge badge-study">RÉVISION</span>
                                    <div style={{fontSize:54, fontWeight:900}}>{cur.foreign}</div>
                                    <div style={{fontSize:36, color:'#64748b', marginBottom:40}}>{cur.french}</div>
                                    <Button onClick={() => block === 2 ? setStep('JOL') : goToNext()} variant="accent">Suivant</Button>
                                </div>
                            )
                        )}

                        {step === 'FB' && (
                            <div>
                                <h2>{fb.msg}</h2>
                                {fb.show && <div style={{fontSize:36, fontWeight:900, margin:'20px 0'}}>{cur.foreign} = {cur.french}</div>}
                                <Button onClick={() => block === 2 ? setStep('JOL') : goToNext()} variant="primary">Continuer</Button>
                            </div>
                        )}

                        {step === 'JOL' && (
                            <div className="jol-container">
                                <p className="jol-question">Dans une semaine, penses-tu être capable d'écrire le mot Français si on te montre le mot Allemand ?</p>
                                <div className="jol-scale">
                                    <div className="jol-label" style={{textAlign:'left'}}>Pas certain</div>
                                    {[
                                        { s: "☹️", v: 1 }, { s: "🙁", v: 2 }, { s: "😐", v: 3 }, { s: "🙂", v: 4 }, { s: "😄", v: 5 }
                                    ].map(item => (
                                        <div key={item.v} className="jol-item">
                                            <span className="jol-smiley" onClick={() => setJolValue(item.v)}>{item.s}</span>
                                            <input type="radio" name="jol" className="jol-radio" checked={jolValue === item.v} onChange={() => setJolValue(item.v)} />
                                        </div>
                                    ))}
                                    <div className="jol-label" style={{textAlign:'right'}}>Très certain</div>
                                </div>
                                <div style={{marginTop: 40}}>
                                    <Button onClick={handleJolSubmit} variant="accent" disabled={!jolValue}>Valider ma réponse</Button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ProgressBar({ current, total, label }) {
            return (
                <div style={{marginBottom: 10}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:12, color:'#64748b', marginBottom:5}}>
                        <span>{label}</span><span>{current} / {total}</span>
                    </div>
                    <div className="progress-bar"><div className="progress-fill" style={{width: `${(current/total)*100}%`}}></div></div>
                </div>
            );
        }

        function Button({ children, onClick, variant, style, disabled }) { 
            return <button className={`btn btn-${variant || 'primary'}`} onClick={onClick} style={style} disabled={disabled}>{children}</button>; 
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
